name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  test:
    name: Python 3.10 / ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.10"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest
      - name: Build distributions
        run: uv build
      - name: Validate wheel and console scripts
        shell: python
        run: |
          import os
          import pathlib
          import subprocess
          import tempfile

          wheel, = pathlib.Path("dist").glob("*.whl")
          with tempfile.TemporaryDirectory() as directory:
              environment = pathlib.Path(directory)
              subprocess.run(["uv", "venv", environment], check=True)
              scripts = environment / ("Scripts" if os.name == "nt" else "bin")
              python = scripts / ("python.exe" if os.name == "nt" else "python")
              subprocess.run(
                  ["uv", "pip", "install", "--python", python, "--no-index", wheel],
                  check=True,
              )
              suffix = ".exe" if os.name == "nt" else ""
              for command in (
                  "ai-accounts",
                  "codex-accounts",
                  "claude-accounts",
                  "agy-accounts",
                  "grok-accounts",
                  "vibe-accounts",
              ):
                  subprocess.run([scripts / f"{command}{suffix}", "--help"], check=True)
