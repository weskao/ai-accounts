name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  test:
    name: Python 3.10 / ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.10"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest
      - name: Build distributions
        run: uv build
      - name: Validate wheel and console scripts
        shell: python
        run: |
          import os
          import pathlib
          import subprocess

          wheel, = pathlib.Path("dist").glob("*.whl")
          scripts = pathlib.Path(".venv") / ("Scripts" if os.name == "nt" else "bin")
          python = scripts / ("python.exe" if os.name == "nt" else "python")
          subprocess.run(
              ["uv", "pip", "install", "--python", python, "--no-deps", "--reinstall", wheel],
              check=True,
          )
          suffix = ".exe" if os.name == "nt" else ""
          for command in (
              "ai-accounts",
              "codex-accounts",
              "claude-accounts",
              "agy-accounts",
              "grok-accounts",
              "vibe-accounts",
          ):
              subprocess.run([scripts / f"{command}{suffix}", "--help"], check=True)

  notify-telegram:
    needs: test
    if: ${{ failure() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ci_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          message="🚨 <b>CI failed</b>

          <b>Repository:</b> <code>$GITHUB_REPOSITORY</code>
          <b>Branch:</b> <code>$GITHUB_REF_NAME</code>
          <b>Commit:</b> <code>${GITHUB_SHA::7}</code>

          <a href=\"$ci_url\">Open failed CI run</a>"
          curl --fail --silent --show-error \
            --data-urlencode "chat_id=$CHAT_ID" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=$message" \
            "https://api.telegram.org/bot$TOKEN/sendMessage"
