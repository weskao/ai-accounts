[project]
name = "ai-accounts"
version = "0.4.0"
description = "Manage and switch profiles across AI coding CLIs"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Wes Kao" }]
license = { text = "MIT" }
dependencies = []

[project.scripts]
codex-accounts = "ai_accounts.codex_accounts:main"
claude-accounts = "ai_accounts.claude_accounts:main"
agy-accounts = "ai_accounts.gemini_accounts:main"
grok-accounts = "ai_accounts.grok_accounts:main"
vibe-accounts = "ai_accounts.vibe_accounts:main"
ai-accounts = "ai_accounts.ai_accounts:main"

[project.urls]
Repository = "https://github.com/weskao/ai-accounts"
Issues = "https://github.com/weskao/ai-accounts/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_accounts"]

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]
