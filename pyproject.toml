[project]
name = "ai-accounts"
version = "4.0.0"
description = "Personal CLI toolbox extracted from ~/.zshrc, packaged as uv tools"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "ai-accounts" }]
license = { text = "MIT" }
dependencies = ["pypinyin"]

[project.scripts]
gtrans = "ai_accounts.gtrans:main"
charcount = "ai_accounts.charcount:main"
imgmin = "ai_accounts.imgmin:main"
resize-image = "ai_accounts.resize:main"
towebp = "ai_accounts.towebp:main"
html2md = "ai_accounts.html_to_md:main"
vcadd = "ai_accounts.vcadd:main"
codex-accounts = "ai_accounts.codex_accounts:main"
claude-accounts = "ai_accounts.claude_accounts:main"
agy-accounts = "ai_accounts.gemini_accounts:main"
grok-accounts = "ai_accounts.grok_accounts:main"
vibe-accounts = "ai_accounts.vibe_accounts:main"
ai-accounts = "ai_accounts.ai_accounts:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai-accounts"]

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]
